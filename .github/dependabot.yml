version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Major upgrades require a coordinated compatibility review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      python-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/scripts/react-ui"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Major upgrades require a coordinated compatibility review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/scripts/react-ui/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Major upgrades require a coordinated compatibility review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      rust-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Major upgrades require a coordinated compatibility review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      actions-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
