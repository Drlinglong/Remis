version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # Ordinary version upgrades are reviewed and batched manually.
    # Security updates use a separate limit and remain enabled below.
    open-pull-requests-limit: 0
    ignore:
      # Major upgrades require a coordinated compatibility review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/scripts/react-ui"
    schedule:
      interval: monthly
    # Ordinary version upgrades are reviewed and batched manually.
    # Security updates use a separate limit and remain enabled below.
    open-pull-requests-limit: 0
    ignore:
      # Major upgrades require a coordinated compatibility review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/scripts/react-ui/src-tauri"
    schedule:
      interval: monthly
    # Ordinary version upgrades are reviewed and batched manually.
    # Security updates use a separate limit and remain enabled below.
    open-pull-requests-limit: 0
    ignore:
      # Major upgrades require a coordinated compatibility review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Ordinary version upgrades are reviewed and batched manually.
    # Security updates use a separate limit and remain enabled below.
    open-pull-requests-limit: 0
    ignore:
      # Major upgrades require a coordinated compatibility review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
