[pytest]
# Shared test discovery settings for the Remis backend suite.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Keep pytest state outside the repository. Codex sandbox runs can create cache
# directories with ACLs that a later packaging process cannot remove.
addopts = -v --tb=short -p no:cacheprovider -p scripts.developer_tools.pytest_safety
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
